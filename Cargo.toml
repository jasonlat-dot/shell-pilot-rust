[package]
name = "shellpilot-server"
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
description = "ShellPilot embedded Rust backend"
autobins = false

[lib]
name = "shellpilot_server"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.13"
async-stream = "0.3"
futures-util = "0.3"
russh-sftp = "3.0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
sha1 = "0.11"
sha2 = "0.11"
getrandom = "0.4"
url = "2"
percent-encoding = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22.1"
lopdf = { version = "0.45", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
